.hero::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  background: radial-gradient(ellipse at 50% 80%, rgba(201,168,76,0.1) 0%, transparent 60%);
}
.hero-content { position: relative; z-index: 1; }
.hero-logo {
  width: 56px;
  height: 56px;
  border-radius: 50%;
  margin: 0 auto 0.6rem;
  display: block;
  border: 2px solid rgba(201,168,76,0.4);
}
.logo {
  font-family: 'Playfair Display', serif;
  font-size: 1.6rem;
  font-weight: 700;
  color: var(--white);
  letter-spacing: 2px;
  margin-bottom: 0.2rem;
}
.logo span { color: var(--gold); }
.hero-sub {
  font-size: 0.75rem;
  color: rgba(255,255,255,0.6);
  font-weight: 300;
  letter-spacing: 3px;
  text-transform: uppercase;
}


.lang-switch {
  position: absolute;
  top: 12px;
  right: 16px;
  z-index: 10;
  display: flex;
  align-items: center;
  gap: 4px;
}
.lang-btn {
  background: none;
  border: none;
  color: rgba(255,255,255,0.4);
  font-family: 'DM Sans', sans-serif;
  font-size: 0.75rem;
  font-weight: 500;
  cursor: pointer;
  padding: 2px 4px;
  letter-spacing: 1px;
  transition: color 0.3s;
}
.lang-btn:hover { color: rgba(255,255,255,0.8); }
.lang-btn.active { color: var(--white); font-weight: 600; }
.lang-sep { color: rgba(255,255,255,0.25); font-size: 0.7rem; }
.hero-contact {
  margin-top: 0.8rem;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  flex-wrap: wrap;
}
.hero-contact a {
  color: rgba(255,255,255,0.7);
  text-decoration: none;
  font-size: 0.75rem;
  transition: color 0.3s;
}
.hero-contact a:hover { color: var(--gold); }
.hero-dot { color: rgba(255,255,255,0.3); font-size: 0.7rem; }
.wave-divider {
  background: transparent;
  margin-top: -1px;
}
.wave-divider svg { display: block; width: 100%; height: 40px; }

.container {
  max-width: 520px;
  margin: 1.5rem auto 3rem;
  padding: 0 1.2rem;
}
.card {
  background: var(--white);
  border-radius: var(--radius);
  padding: 2rem 1.8rem;
  box-shadow: 0 4px 24px rgba(0,0,0,0.06);
  position: relative;
}
.card::before {
  content: '';
  position: absolute;
  top: 0; left: 2rem; right: 2rem;
  height: 3px;
  background: linear-gradient(90deg, var(--gold), var(--gold-light), var(--gold));
  border-radius: 0 0 3px 3px;
}
.card-title {
  font-family: 'Playfair Display', serif;
  font-size: 1.4rem;
  font-weight: 600;
  color: var(--navy);
  margin-bottom: 1.5rem;
  text-align: center;
}
.form-group { margin-bottom: 1.2rem; }
.form-label {
  display: block;
  font-size: 0.8rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--text-light);
  margin-bottom: 0.4rem;
}
.form-input, .form-select {
  width: 100%;
  padding: 12px 14px;
  border: 1.5px solid #E0E0E0;
  border-radius: 8px;
  font-family: 'DM Sans', sans-serif;
  font-size: 0.95rem;
  color: var(--text);
  transition: border-color 0.3s, box-shadow 0.3s;
  background: var(--white);
  outline: none;
}
.form-input:focus, .form-select:focus {
  border-color: var(--gold);
  box-shadow: 0 0 0 3px rgba(201,168,76,0.15);
}
.form-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 1rem;
}

.promo-wrapper {
  display: flex;
  gap: 8px;
}
.promo-input {
  flex: 1;
  text-transform: uppercase;
  letter-spacing: 2px;
  font-weight: 500;
}
.promo-apply-btn {
  width: 44px;
  border: 1.5px solid var(--gold);
  background: transparent;
  border-radius: 8px;
  color: var(--gold);
  font-size: 1.1rem;
  cursor: pointer;
  transition: all 0.3s;
  flex-shrink: 0;
}
.promo-apply-btn:hover {
  background: var(--gold);
  color: var(--navy);
}
.promo-apply-btn.valid {
  background: var(--green);
  border-color: var(--green);
  color: white;
}
.promo-apply-btn.invalid {
  background: var(--red);
  border-color: var(--red);
  color: white;
}
.promo-status {
  font-size: 0.8rem;
  margin-top: 4px;
  min-height: 18px;
}
.promo-status.valid { color: var(--green); }
.promo-status.invalid { color: var(--red); }
.admin-fields { display: none; }

<script>

// ===== PROMO CODES =====
const PROMO_CODES = {
  "SUMMER10": { discount: 10, type: "percent" },
  "EARLY15": { discount: 15, type: "percent" },
  "WELCOME5": { discount: 5, type: "percent" },
  "VIP20": { discount: 20, type: "percent" },
  "FLAT200": { discount: 200, type: "fixed" }
};

let activePromo = null;

function applyPromo() {
  const input = document.getElementById('inputPromo');
  const status = document.getElementById('promoStatus');
  const btn = document.getElementById('promoApplyBtn');
  const code = input.value.trim().toUpperCase();
  
  btn.classList.remove('valid', 'invalid');
  status.classList.remove('valid', 'invalid');
  
  if (!code) { activePromo = null; status.textContent = ''; return; }
  
  if (PROMO_CODES[code]) {
    activePromo = { code: code, ...PROMO_CODES[code] };
    btn.classList.add('valid');
    status.classList.add('valid');
    const p = PROMO_CODES[code];
    if (p.type === 'percent') {
      status.textContent = currentLang === 'tr' ? '✓ %' + p.discount + ' indirim uygulanacak!' : currentLang === 'ru' ? '✓ Скидка ' + p.discount + '%!' : '✓ ' + p.discount + '% discount will be applied!';
    } else {
      status.textContent = currentLang === 'tr' ? '✓ €' + p.discount + ' indirim uygulanacak!' : currentLang === 'ru' ? '✓ Скидка €' + p.discount + '!' : '✓ €' + p.discount + ' discount will be applied!';
    }
  } else {
    activePromo = null;
    btn.classList.add('invalid');
    status.classList.add('invalid');
    status.textContent = currentLang === 'tr' ? '✗ Geçersiz kod' : currentLang === 'ru' ? '✗ Неверный код' : '✗ Invalid code';
  }
}
const WEBHOOK_URL = "https://freyayachting.app.n8n.cloud/webhook/offer-request";
const i18n = {
  en: {
    formTitle: "Request an Offer", formTitleAdmin: "Create Offer (Admin)",
    labelName: "Full Name", labelPhone: "Phone", labelEmail: "Email",
    labelStartDate: "Start Date", labelNights: "Nights", labelGuests: "Number of Guests",
    labelSource: "Source", btnText: "Get Offer", btnTextAdmin: "Generate Offer",
    modeCustomer: "Customer", modeAdmin: "Admin", resultBadge: "✓ Available",
    resultTitle: "Your Offer", resultTitleAdmin: "Offer Generated",
    labelYacht: "Yacht + Captain", labelSeason: "Season", labelDaysLeft: "Days Until Charter",
    labelOccupancy: "Monthly Occupancy", labelExtras: "Optional Extras",
    labelTotal: "All-inclusive Total", labelExpiry: "Offer valid until",
    naTitle: "Dates Not Available", naText: "Unfortunately the selected dates are not available. Please try different dates.",
    errorText: "Something went wrong. Please try again.",
    placeholderName: "John Smith", placeholderPhone: "+44 7700 900000", placeholderEmail: "john@example.com",
    nightsSuffix: "nights", guestsSuffix: "guests",
    minNightsWarn: "⚠️ Minimum stay is {n} nights for this period."
  },
  tr: {
    formTitle: "Teklif Al", formTitleAdmin: "Teklif Oluştur (Admin)",
    labelName: "Ad Soyad", labelPhone: "Telefon", labelEmail: "E-posta",
    labelStartDate: "Başlangıç Tarihi", labelNights: "Gece", labelGuests: "Misafir Sayısı",
    labelSource: "Kaynak", btnText: "Teklif Al", btnTextAdmin: "Teklif Oluştur",
    modeCustomer: "Müşteri", modeAdmin: "Admin", resultBadge: "✓ Müsait",
    resultTitle: "Teklifiniz", resultTitleAdmin: "Teklif Oluşturuldu",
    labelYacht: "Tekne + Kaptan", labelSeason: "Sezon", labelDaysLeft: "Kiralama Tarihine",
    labelOccupancy: "Aylık Doluluk", labelExtras: "Opsiyonel Ekstralar",
    labelTotal: "Her Şey Dahil Toplam", labelExpiry: "Teklif geçerlilik süresi",
    naTitle: "Tarihler Müsait Değil", naText: "Seçtiğiniz tarihler maalesef dolu. Lütfen farklı tarih deneyin.",
    errorText: "Bir hata oluştu. Lütfen tekrar deneyin.",
    placeholderName: "Ahmet Yılmaz", placeholderPhone: "+90 532 000 0000", placeholderEmail: "ahmet@ornek.com",
    nightsSuffix: "gece", guestsSuffix: "misafir",
    minNightsWarn: "⚠️ Bu dönem için minimum konaklama {n} gecedir."
  }
};
i18n.ru = {
    formTitle: "Запросить предложение",
    labelName: "Имя и фамилия",
    labelPhone: "Телефон",
    labelEmail: "Эл. почта",
    labelStartDate: "Дата начала",
    labelNights: "Ночей",
    labelGuests: "Количество гостей",
    labelSource: "Источник",
    btnText: "Получить предложение",
    resultBadge: "✓ Доступно",
    resultTitle: "Ваше предложение",
    labelYacht: "Яхта + Капитан",
    labelSeason: "Сезон",
    labelDaysLeft: "Дней до чартера",
    labelOccupancy: "Загрузка за месяц",
    labelExtras: "Дополнительные услуги",
    labelTotal: "Итого всё включено",
    labelExpiry: "Предложение действительно до",
    naTitle: "Даты недоступны",
    naText: "К сожалению, выбранные даты заняты. Пожалуйста, выберите другие даты.",
    errorText: "Что-то пошло не так. Попробуйте ещё раз.",
    placeholderName: "Иван Иванов",
    placeholderPhone: "+7 900 000 0000",
    placeholderEmail: "ivan@example.com",
    nightsSuffix: "ночей",
    guestsSuffix: "гостей",
    minNightsWarn: "⚠️ Минимальный срок аренды — {n} ночей."
  };
let currentLang = 'en';
let currentMode = 'customer';
function setLang(lang) {
  currentLang = lang;
  document.querySelectorAll('#langToggle .lang-btn').forEach(b => b.classList.toggle('active', b.dataset.lang === lang));
  updateUI();
}
function setMode(mode) {
  currentMode = mode;
  document.querySelectorAll('#modeToggle .toggle-btn').forEach(b => b.classList.toggle('active', b.dataset.mode === mode));
  document.getElementById('adminFields').classList.toggle('show', mode === 'admin');
  updateUI();
}
function t(key) { return i18n[currentLang][key] || key; }
function updateUI() {
  document.getElementById('formTitle').textContent = t('formTitle');
  document.getElementById('labelName').textContent = t('labelName');
  document.getElementById('labelPhone').textContent = t('labelPhone');
  document.getElementById('labelEmail').textContent = t('labelEmail');
  document.getElementById('labelStartDate').textContent = t('labelStartDate');
  document.getElementById('labelNights').textContent = t('labelNights');
  document.getElementById('labelGuests').textContent = t('labelGuests');
  document.getElementById('btnText').textContent = t('btnText');
  document.getElementById('inputName').placeholder = t('placeholderName');
  document.getElementById('inputPhone').placeholder = t('placeholderPhone');
  document.getElementById('inputEmail').placeholder = t('placeholderEmail');
  document.getElementById('labelPromo').textContent = currentLang === 'tr' ? 'Promosyon Kodu' : currentLang === 'ru' ? 'Промокод' : 'Promo Code';
  document.getElementById('inputPromo').placeholder = currentLang === 'tr' ? 'Promosyon kodunuz' : currentLang === 'ru' ? 'Ваш промокод' : 'Your promo code';
  document.getElementById('contactTitle').textContent = currentLang === 'tr' ? 'İletişim' : currentLang === 'ru' ? 'Контакты' : 'Contact Us';
  document.getElementById('contactAddress').textContent = currentLang === 'tr' ? 'Ecesaray Marina, Fethiye, Muğla' : 'Ecesaray Marina, Fethiye, Muğla';
  document.getElementById('contactHours').textContent = currentLang === 'tr' ? 'Her gün 09:00 – 19:00' : currentLang === 'ru' ? 'Ежедневно 09:00 – 19:00' : 'Open every day 09:00 – 19:00';
  document.getElementById('wpTooltip').textContent = currentLang === 'tr' ? '💬 Sorularınız mı var? WhatsApp ile yazın!' : currentLang === 'ru' ? '💬 Есть вопросы? Напишите в WhatsApp!' : '💬 Questions? Chat with us on WhatsApp!';
}
const seasonMap = {
  en: { HIGH: "High Season ☀️", MID: "Mid Season 🌤", LOW: "Low Season 🍂" },
  tr: { HIGH: "Yüksek Sezon ☀️", MID: "Orta Sezon 🌤", LOW: "Düşük Sezon 🍂" },
  ru: { HIGH: "Высокий сезон ☀️", MID: "Средний сезон 🌤", LOW: "Низкий сезон 🍂" }
};
async function submitForm() {
  const btn = document.getElementById('btnSubmit');
  const resultArea = document.getElementById('resultArea');
  resultArea.classList.remove('show');
  resultArea.innerHTML = '';
  const payload = {
    name: document.getElementById('inputName').value.trim(),
    phone: document.getElementById('inputPhone').value.trim(),
    email: document.getElementById('inputEmail').value.trim(),
    startDate: document.getElementById('inputStartDate').value,
    nights: Number(document.getElementById('inputNights').value),
    guests: Number(document.getElementById('inputGuests').value),
    source: 'Website'
  };
  if (!payload.startDate) { alert(currentLang === 'tr' ? 'Lütfen tarih seçin.' : currentLang === 'ru' ? 'Пожалуйста, выберите дату.' : 'Please select a date.'); return; }
  btn.classList.add('loading');
  btn.disabled = true;
  try {
    const res = await fetch(WEBHOOK_URL, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) });
    const data = await res.json();
    if (data.reason === "NotAvailable" || data.ok === false) { showNotAvailable(); }
    else if (data.DynamicPrice || data.dynamicPrice) { showResult(data); }
    else { showError(); }
  } catch (err) { console.error(err); showError(); }
  finally { btn.classList.remove('loading'); btn.disabled = false; }
}
function showResult(data) {
  const area = document.getElementById('resultArea');
  let price = Number(data.DynamicPrice || data.dynamicPrice);
  if (activePromo) {
    if (activePromo.type === "percent") {
      price = price * (1 - activePromo.discount / 100);
    } else {
      price = price - activePromo.discount;
    }
    price = Math.max(0, Math.round(price / 10) * 10);
  }
  const season = data.Season || data.season;
  const nights = data.Nights || data.nights;
  const guests = data.Guests || data.guests;
  const daysLeft = data.DaysLeft || data.daysLeft;
  const occupancy = data.Occupancy || data.occupancy || 0;
  const minNights = data.MinNights || data.minNights;
  const minWarn = data.MinNightsWarning || data.minNightsWarning;
  const allExtras = data.AllExtrasTotal || data.allExtrasTotal || 0;
  const expiry = data.ExpiresAt || data.expiresAt;
  let extrasHtml = '';
  try {
    const upsells = typeof data.UpsellsJSON === 'string' ? JSON.parse(data.UpsellsJSON) : (data.upsellsJSON || null);
    if (upsells && upsells.extras) {
      extrasHtml = '<div class="result-extras"><div class="result-extras-title">' + t('labelExtras') + '</div>' +
        upsells.extras.map(e => '<div class="extra-item"><span class="extra-name">' + e.name + ' — ' + e.desc + '</span><span class="extra-price">€' + e.total + '</span></div>').join('') + '</div>';
    }
  } catch(e) {}
  const totalPrice = Number(price) + Number(allExtras);
  const expiryDate = expiry ? new Date(expiry).toLocaleDateString(currentLang === 'tr' ? 'tr-TR' : 'en-GB', { day: 'numeric', month: 'long', year: 'numeric', hour: '2-digit', minute: '2-digit' }) : '';
  const minWarnHtml = minWarn ? '<div style="background:#FFF3E0;padding:10px 14px;border-radius:8px;margin-bottom:1rem;font-size:0.88rem;color:#E65100;">' + t('minNightsWarn').replace('{n}', minNights) + '</div>' : '';
  area.innerHTML = '<div class="result-card">' + minWarnHtml +
    '<div class="result-badge">' + t('resultBadge') + '</div>' + (activePromo ? '<div class="result-badge" style="background:#FFF3E0;color:#E65100;">🏷️ ' + activePromo.code + (activePromo.type === "percent" ? " (-" + activePromo.discount + "%)" : " (-€" + activePromo.discount + ")") + '</div>' : '') +
    '<div class="result-title">' + (t('resultTitle')) + '</div>' +
    '<div class="result-row"><span class="result-label">📅 ' + t('labelStartDate') + '</span><span class="result-value">' + document.getElementById('inputStartDate').value + ' · ' + nights + ' ' + t('nightsSuffix') + '</span></div>' +
    '<div class="result-row"><span class="result-label">👥 ' + t('labelGuests') + '</span><span class="result-value">' + guests + ' ' + t('guestsSuffix') + '</span></div>' +
    '<div class="result-row"><span class="result-label">🌊 ' + t('labelSeason') + '</span><span class="result-value">' + (seasonMap[currentLang][season] || season) + '</span></div>' +
    '<div class="result-row"><span class="result-label">📊 ' + t('labelOccupancy') + '</span><span class="result-value">%' + occupancy + '</span></div>' +
    '<div class="result-row"><span class="result-label">⛵ ' + t('labelYacht') + '</span><span class="result-value" style="color:var(--gold);font-size:1.1rem;">€' + Number(price).toLocaleString() + '</span></div>' +
    extrasHtml +
    '<div class="result-total"><span class="result-label">' + t('labelTotal') + '</span><span class="result-value">€' + totalPrice.toLocaleString() + '</span></div>' +
    (expiryDate ? '<div class="result-expiry">⏳ ' + t('labelExpiry') + ': <strong>' + expiryDate + '</strong></div>' : '') +
    '</div>';
  area.classList.add('show');
  area.scrollIntoView({ behavior: 'smooth', block: 'start' });
}
function showNotAvailable() {
  const area = document.getElementById('resultArea');
  area.innerHTML = '<div class="not-available-card"><div class="na-icon">📅</div><div class="result-title">' + t('naTitle') + '</div><div class="na-text">' + t('naText') + '</div></div>';
  area.classList.add('show');
}
function showError() {
  const area = document.getElementById('resultArea');
  area.innerHTML = '<div class="not-available-card"><div class="na-icon">⚠️</div><div class="na-text">' + t('errorText') + '</div></div>';
  area.classList.add('show');
}
updateUI();
const today = new Date().toISOString().split('T')[0];
document.getElementById('inputStartDate').setAttribute('min', today);
</script>
